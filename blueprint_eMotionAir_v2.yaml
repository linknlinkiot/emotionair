blueprint:
  name: LinknLink eMotion Air Smart Button Controller (v2)
  description: >-
    Automation blueprint for the eMotion Air (Zigbee version).

    Button actions are reported through the standard Multistate Input Basic
    cluster (0x0012) present_value attribute. No ZHA quirk is required if ZHA
    exposes a present_value sensor for the device after pairing / re-interview.

    present_value mapping:
      0 = idle
      1 = single click
      2 = double click
      3 = triple click
      4 = hold (fires after the button has been held for about 2 seconds)

    Select the eMotion Air device itself (not battery / humidity sensors).
    The blueprint automatically resolves that device's present_value sensor.
  domain: automation
  input:
    remote:
      name: Select eMotion Air Device
      description: >-
        Choose the LinknLink eMotion Air Zigbee device. Do not select battery,
        humidity or other sensor entities.
      selector:
        device:
          integration: zha
          manufacturer: LinknLink
          model: eMotion Air
    single_press:
      name: Single Click Action
      default: []
      selector:
        action: {}
    double_press:
      name: Double Click Action
      default: []
      selector:
        action: {}
    triple_press:
      name: Triple Click Action
      default: []
      selector:
        action: {}
    long_press:
      name: Hold Action (button held for ~2s)
      default: []
      selector:
        action: {}

mode: restart
max_exceeded: silent

trigger_variables:
  device_id: !input remote
  button_entity: >-
    {% set ents = device_entities(device_id) | list %}
    {{ ents
       | select('search', 'present_value')
       | list
       | first
       | default(
           ents
           | select('search', 'multistate')
           | list
           | first
           | default('')
         )
    }}

triggers:
  - trigger: state
    entity_id: "{{ button_entity }}"
    not_to:
      - "0"
      - "unknown"
      - "unavailable"
      - ""

conditions:
  - condition: template
    value_template: "{{ button_entity != '' }}"

actions:
  - variables:
      button_value: "{{ trigger.to_state.state | int(-1) }}"
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ button_value == 1 }}"
        sequence: !input single_press
      - conditions:
          - condition: template
            value_template: "{{ button_value == 2 }}"
        sequence: !input double_press
      - conditions:
          - condition: template
            value_template: "{{ button_value == 3 }}"
        sequence: !input triple_press
      - conditions:
          - condition: template
            value_template: "{{ button_value == 4 }}"
        sequence: !input long_press
