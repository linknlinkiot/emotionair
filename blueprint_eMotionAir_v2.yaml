# Optional helper. Preferred path for V1.2.7+ is the quirk (zha_event + last_action entity).
blueprint:
  name: LinknLink eMotion Air Smart Button Controller (v2)
  description: >-
    Optional automation blueprint for eMotion Air (Zigbee).

    Preferred path for firmware V1.2.7+:
      install the ZHA quirk, then trigger on zha_event /
      device triggers / last_action entity.

    This blueprint listens to zha_event commands:
      single / double / triple / hold
  domain: automation
  input:
    remote:
      name: Select eMotion Air Device
      description: >-
        Choose the LinknLink eMotion Air Zigbee device.
      selector:
        device:
          integration: zha
          manufacturer: LinknLink
          model: eMotion Air
    single_press:
      name: Single Click Action
      default: []
      selector:
        action: {}
    double_press:
      name: Double Click Action
      default: []
      selector:
        action: {}
    triple_press:
      name: Triple Click Action
      default: []
      selector:
        action: {}
    long_press:
      name: Hold Action (button held for ~2s)
      default: []
      selector:
        action: {}

mode: restart
max_exceeded: silent

variables:
  device_id: !input remote

triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote
      command: single
    id: single
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote
      command: double
    id: double
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote
      command: triple
    id: triple
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input remote
      command: hold
    id: hold

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: single
        sequence: !input single_press
      - conditions:
          - condition: trigger
            id: double
        sequence: !input double_press
      - conditions:
          - condition: trigger
            id: triple
        sequence: !input triple_press
      - conditions:
          - condition: trigger
            id: hold
        sequence: !input long_press
