blueprint:
  name: LinknLink eMotion Air Smart Button Controller (v2)
  description: >-
    Automation blueprint for the eMotion Air (Zigbee version).

    Button actions are reported through the standard Multistate Input Basic
    cluster (0x0012) present_value attribute. No ZHA quirk is required.

    present_value mapping:
      0 = idle
      1 = single click
      2 = double click
      3 = triple click
      4 = hold (fires after the button has been held for about 2 seconds)

    Select the Multistate Input / present_value sensor entity of your
    eMotion Air device (created by ZHA after pairing / re-interview).
  domain: automation
  input:
    button_entity:
      name: eMotion Air Button Entity (present_value)
      description: >-
        ZHA sensor entity for Multistate Input present_value on the eMotion Air.
        Typical name contains present_value / multistate_input.
      selector:
        entity:
          integration: zha
          domain: sensor
    single_press:
      name: Single Click Action
      default: []
      selector:
        action: {}
    double_press:
      name: Double Click Action
      default: []
      selector:
        action: {}
    triple_press:
      name: Triple Click Action
      default: []
      selector:
        action: {}
    long_press:
      name: Hold Action (button held for ~2s)
      default: []
      selector:
        action: {}

mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input button_entity
    not_to:
      - "0"
      - "unknown"
      - "unavailable"

conditions: []

actions:
  - variables:
      button_value: "{{ trigger.to_state.state | int(-1) }}"
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ button_value == 1 }}"
        sequence: !input single_press
      - conditions:
          - condition: template
            value_template: "{{ button_value == 2 }}"
        sequence: !input double_press
      - conditions:
          - condition: template
            value_template: "{{ button_value == 3 }}"
        sequence: !input triple_press
      - conditions:
          - condition: template
            value_template: "{{ button_value == 4 }}"
        sequence: !input long_press
