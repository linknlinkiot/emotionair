blueprint:
  name: LinknLink eMotion Air Smart Button Controller (v2)
  description: >-
    Automation blueprint for the eMotion Air (Zigbee version).

    Button actions are reported through Analog Input Basic (0x000C)
    present_value. ZHA creates this sensor natively without a quirk.

    present_value mapping:
      0 = idle
      1 = single click
      2 = double click
      3 = triple click
      4 = hold (about 2 seconds)

    Select the eMotion Air device itself (not battery / humidity).
    After flashing V1.2.5+ and re-pairing, the device should expose a
    present_value / analog_input sensor entity for this blueprint to fire.
  domain: automation
  input:
    remote:
      name: Select eMotion Air Device
      description: >-
        Choose the LinknLink eMotion Air Zigbee device. Do not select battery,
        humidity or other sensor entities.
      selector:
        device:
          integration: zha
          manufacturer: LinknLink
          model: eMotion Air
    single_press:
      name: Single Click Action
      default: []
      selector:
        action: {}
    double_press:
      name: Double Click Action
      default: []
      selector:
        action: {}
    triple_press:
      name: Triple Click Action
      default: []
      selector:
        action: {}
    long_press:
      name: Hold Action (button held for ~2s)
      default: []
      selector:
        action: {}

mode: restart
max_exceeded: silent

variables:
  device_id: !input remote
  button_entity: >-
    {% set ents = device_entities(device_id) | list %}
    {{ ents
       | select('search', 'analog_input')
       | list
       | first
       | default(
           ents
           | select('search', 'present_value')
           | list
           | first
           | default(
               ents
               | select('search', 'button_action')
               | list
               | first
               | default('')
             )
         )
    }}

triggers:
  - trigger: event
    event_type: state_changed

conditions:
  - condition: template
    value_template: >-
      {{ button_entity != ''
         and trigger.event.data.entity_id == button_entity
         and trigger.event.data.new_state is not none
         and trigger.event.data.new_state.state not in ['0', '0.0', 'unknown', 'unavailable', '']
         and (trigger.event.data.old_state is none
              or trigger.event.data.new_state.state != trigger.event.data.old_state.state) }}

actions:
  - variables:
      button_value: "{{ trigger.event.data.new_state.state | float(-1) | int }}"
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ button_value == 1 }}"
        sequence: !input single_press
      - conditions:
          - condition: template
            value_template: "{{ button_value == 2 }}"
        sequence: !input double_press
      - conditions:
          - condition: template
            value_template: "{{ button_value == 3 }}"
        sequence: !input triple_press
      - conditions:
          - condition: template
            value_template: "{{ button_value == 4 }}"
        sequence: !input long_press
